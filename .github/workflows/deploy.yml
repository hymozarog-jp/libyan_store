name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check supabase.js
          node --check worker.js
          node --check theme.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Smoke-test the live site and frontend assets
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://libyan-store2.hymozarog.workers.dev"

          echo "Checking live homepage..."
          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 6 \
            "$SITE_URL/" --output /tmp/libyan-store-index.html

          grep -qi "Libyan Store" /tmp/libyan-store-index.html
          grep -q "rebuild.css" /tmp/libyan-store-index.html
          grep -q "app.js" /tmp/libyan-store-index.html

          for asset in "rebuild.css" "app.js"; do
            echo "Checking $asset..."
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 3 \
              "$SITE_URL/$asset" --output "/tmp/$asset"
            test -s "/tmp/$asset"
          done

          echo "PASS: homepage and core frontend assets are reachable."

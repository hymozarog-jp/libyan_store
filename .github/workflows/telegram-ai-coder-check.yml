name: Telegram AI Coder checks

on:
  pull_request:
    paths:
      - "telegram_ai_coder/**"
      - ".github/workflows/telegram-ai-coder-check.yml"
  push:
    branches:
      - main
    paths:
      - "telegram_ai_coder/**"
      - ".github/workflows/telegram-ai-coder-check.yml"

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram_ai_coder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: telegram_ai_coder/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile bot.py
      - name: Run safety tests
        run: python -m unittest discover -s tests -v

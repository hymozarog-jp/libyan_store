<!doctype html><!-- deploy-check: 2026-09-20-diagnostic --><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17133f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><meta name="description" content="Libyan Store - متجر البطاقات والاشتراكات الرقمية"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Libyan Store</title><script src="supabase-config.js?v=20260916-2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="styles.css?v=20260924-3"><link rel="stylesheet" href="theme.css?v=20260924-4"></head><body><main id="app"><div class="shell"><div class="card" style="text-align:center">جارٍ تحميل المتجر…</div></div></main><script>
(function(){
  try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(x){x.unregister()})}).catch(function(){}) } }catch(e){}
  window.addEventListener('error',function(e){
    var box=document.getElementById('app');
    if(box && (!box.dataset.ready || box.dataset.ready!=='1')) box.innerHTML='<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><h2>⚠️ خطأ في تشغيل المتجر</h2><p class="muted">'+String(e.message||'خطأ JavaScript')+'</p><small class="muted">'+String(e.filename||'')+' : '+String(e.lineno||'')+'</small><button class="btn primary" style="width:100%;margin-top:14px" onclick="location.reload()">إعادة المحاولة</button></div>';
  });
  window.addEventListener('unhandledrejection',function(e){
    var box=document.getElementById('app'); var msg=e.reason&&(e.reason.message||e.reason) || 'خطأ غير متوقع';
    if(box && (!box.dataset.ready || box.dataset.ready!=='1')) box.innerHTML='<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><h2>⚠️ تعذر فتح المتجر</h2><p class="muted">'+String(msg)+'</p><button class="btn primary" style="width:100%;margin-top:14px" onclick="location.reload()">إعادة المحاولة</button></div>';
  });
  var app=document.getElementById('app');
  var files=[
    {src:'supabase.js?v=20260920-1',core:true},
    {src:'app.js?v=20260924-3',core:true},
    {src:'topup-status.js?v=20260919-1'},
    {src:'product-images.js?v=20260924-6'},
    {src:'theme.js?v=20260924-5'}
  ];
  function loadScript(src,timeout){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script'),done=false,t=setTimeout(function(){if(!done){done=true;s.remove();reject(new Error('timeout: '+src))}},timeout||8000);
      s.onload=function(){if(!done){done=true;clearTimeout(t);resolve()}};
      s.onerror=function(){if(!done){done=true;clearTimeout(t);s.remove();reject(new Error('load: '+src))}};
      s.src=src;document.head.appendChild(s);
    });
  }
  async function start(){
    try{
      await loadScript(files[0].src,8000);
      await loadScript(files[1].src,12000);
    }catch(e){
      app.innerHTML='<div class="card" style="max-width:430px;margin:30px auto;text-align:center"><h2>⚠️ تعذر تشغيل المتجر</h2><p class="muted">حدثت مشكلة أثناء تحميل ملفات المتجر.</p><small class="muted">'+String(e.message||e)+'</small><button class="btn primary" style="width:100%;margin-top:14px" onclick="location.reload()">إعادة المحاولة</button></div>';
      return;
    }
    for(var j=2;j<files.length;j++){
      try{await loadScript(files[j].src,8000)}catch(e){console.warn('Optional storefront script failed:',e.message||e)}
    }
    document.getElementById('app').dataset.ready='1';
  }
  start();
})();
</script></body></html>

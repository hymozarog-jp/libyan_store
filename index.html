<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17133f"><meta name="description" content="Libyan Store - متجر البطاقات والاشتراكات الرقمية"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Libyan Store</title><script src="supabase-config.js?v=20260916-2"></script><link rel="stylesheet" href="styles.css?v=20260919-2"><link rel="stylesheet" href="theme.css?v=20260919-2"></head><body><main id="app"><div class="shell"><div class="card" style="text-align:center">جارٍ تحميل المتجر…</div></div></main><script>
(function(){
  var files=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'
  ];
  function loadScript(src,timeout){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script'),done=false,t=setTimeout(function(){if(!done){done=true;s.remove();reject(new Error('timeout'))}},timeout||8000);
      s.onload=function(){if(!done){done=true;clearTimeout(t);resolve()}};
      s.onerror=function(){if(!done){done=true;clearTimeout(t);s.remove();reject(new Error('load'))}};
      s.src=src;document.head.appendChild(s);
    });
  }
  async function start(){
    var loaded=false;
    for(var i=0;i<files.length;i++){try{await loadScript(files[i],7000);if(window.supabase){loaded=true;break}}catch(e){}}
    if(!loaded){document.getElementById('app').innerHTML='<div class="card" style="text-align:center;margin-top:30px"><h2>تعذر تحميل مكتبة المتجر</h2><p class="muted">تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.</p></div>';return}
    var list=['supabase.js?v=20260919-1','app.js?v=20260919-5','topup-status.js?v=20260919-1','product-enhancements.js?v=20260919-2','product-images.js?v=20260919-2','auth-recovery.js?v=20260918-2','theme.js?v=20260919-3'];
    for(var j=0;j<list.length;j++)await loadScript(list[j],10000);
  }
  start();
})();
</script></body></html>

<style>
.ls-loader{position:fixed;inset:0;z-index:99999;min-height:100svh;transition:opacity .3s ease;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;direction:rtl;background:radial-gradient(ellipse at 50% 35%,#30205d 0%,#1b1740 42%,#0e1024 100%);color:#fff;overflow:hidden}

</head><body><div id="lsLoader" class="ls-loader" role="status" aria-live="polite"><div class="ls-loader-logo">L</div><div class="ls-loader-kicker">LIBYAN STORE</div><h1>نجهّز متجرك ✨</h1><p class="ls-loader-sub">لحظات ونفتح لك عالم Robux</p><div class="ls-loader-percent" id="lsLoaderPercent">0%</div><div class="ls-loader-track"><div class="ls-loader-fill" id="lsLoaderFill"></div></div><div class="ls-loader-stage" id="lsLoaderStage">نحضّر واجهة المتجر...</div><div class="ls-loader-dots"><i></i><i></i><i></i></div><div class="ls-loader-tip" id="lsLoaderTip">💜 تجربة تسوّق أسهل، خطوة بخطوة</div></div><main id="app"><div class="shell"><div class="card" style="text-align:center">جارٍ تحميل المتجر…</div></div></main><script>
(function(){
  window.mapCover = window.mapCover || function(){ return ''; };
  try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(x){x.unregister()})}).catch(function(){}) } }catch(e){}
  window.addEventListener('error',function(e){

  });
  window.addEventListener('unhandledrejection',function(e){
    var box=document.getElementById('app'); var msg=e.reason&&(e.reason.message||e.reason) || 'خطأ غير متوقع';
    if(box && (!box.dataset.ready || box.dataset.ready!=='1')) box.innerHTML='<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><h2>⚠️ تعذر فتح المتجر</h2><p class="muted">'+String(msg)+'</p><button class="btn primary" style="width:100%;margin-top:14px" onclick="location.reload()">إعادة المحاولة</button></div>';
  });
  var app=document.getElementById('app');
  var loaderTips=['💜 تجربة تسوّق أسهل، خطوة بخطوة','⚡ جهّز نفسك لاختيار باقة Robux المناسبة','🔒 نجهّز حسابك وتجربة التسوق'];
  var loaderTipIndex=0;

    var number=document.getElementById('lsLoaderPercent'),fill=document.getElementById('lsLoaderFill'),label=document.getElementById('lsLoaderStage');
    if(number)number.textContent=p+'%';
    if(fill)fill.style.width=p+'%';
    if(label)label.textContent=stage||'نجهّز متجرك...';
  }
  function showLoader(){setLoadProgress(3,'نحضّر واجهة المتجر...');}
  showLoader();
  var files=[
    {src:'supabase.js?v=20260920-1',core:true},
    {src:'app.js?v=20261018-welcome-1',core:true},
    {src:'google-avatar-fix.js?v=20261018-2'},
    {src:'topup-status.js?v=20260919-1'},
    {src:'product-images.js?v=20260924-11'},

    {src:'wallet-ui-fix.js?v=20261018-wallet-fix-1'},
    {src:'restore-layout.js?v=1'}
  ];
  function loadScript(src,timeout){
    return new Promise(function(resolve,reject){var s=document.createElement('script'),done=false,t=setTimeout(function(){if(!done){done=true;s.remove();reject(new Error('timeout: '+src))}},timeout||8000);s.onload=function(){if(!done){done=true;clearTimeout(t);resolve()}};s.onerror=function(){if(!done){done=true;clearTimeout(t);s.remove();reject(new Error('load: '+src))}};s.src=src;document.head.appendChild(s);});
  }
  async function start(){

    document.getElementById('app').dataset.ready='1';
    var loader=document.getElementById('lsLoader');if(loader){loader.style.opacity='0';loader.style.pointerEvents='none';setTimeout(function(){loader.remove()},350);}
  }
  start();
})();
</script></body></html>

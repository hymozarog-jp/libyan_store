<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Libyan Store</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body style="margin:0;background:#070b12;color:#fff;font-family:system-ui,Tahoma,Arial"><main style="max-width:900px;margin:auto;padding:20px 14px"><section style="background:#0d131c;border:1px solid #263345;border-radius:24px;padding:20px;box-shadow:0 18px 50px #0006"><div id="app"></div></section></main><script>
const cfg=window.LIBYAN_STORE_CONFIG||{};const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!cfg.url||!cfg.publishableKey){app.innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:40px">⚡</div><h1>Libyan Store</h1><p style="color:#ff9b69">أضف إعدادات Supabase في supabase-config.js</p></div>'}else{const sb=supabase.createClient(cfg.url,cfg.publishableKey);start();
async function start(){const {data:{session}}=await sb.auth.getSession();session?home(session):login();}
function login(){app.innerHTML=`<div style="max-width:430px;margin:20px auto;text-align:center"><div style="font-size:42px">⚡</div><h1>Libyan Store</h1><p style="color:#8d98aa">اشتراكات رقمية — محفظة — تسليم الأكواد</p><div style="display:grid;gap:10px;text-align:right"><input id="email" type="email" placeholder="البريد الإلكتروني" style="padding:14px;border-radius:12px;border:1px solid #263345;background:#0a1017;color:#fff"><input id="pass" type="password" placeholder="كلمة المرور" style="padding:14px;border-radius:12px;border:1px solid #263345;background:#0a1017;color:#fff"><button id="in" style="padding:14px;border:0;border-radius:12px;background:#ff6428;color:#fff;font-weight:700">دخول</button><button id="up" style="padding:14px;border:1px solid #344357;border-radius:12px;background:#111822;color:#fff">إنشاء حساب</button></div><p id="msg" style="color:#9ba7b8"></p></div>`;in.onclick=()=>auth(0);up.onclick=()=>auth(1)}
async function auth(signup){msg.textContent='جارٍ التنفيذ...';const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(password.length<6)return msg.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل';const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)return msg.textContent=r.error.message;if(signup&&!r.data.session)return msg.textContent='تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجّل الدخول.';start()}
async function home(session){const uid=session.user.id;const [{data:p},{data:w},{data:products},{data:topups},{data:orders}]=await Promise.all([sb.from('profiles').select('full_name,phone,role').eq('id',uid).single(),sb.from('wallets').select('balance').eq('user_id',uid).single(),sb.from('products').select('id,name,description,price,currency').eq('active',true).order('created_at'),sb.from('wallet_topups').select('id,amount,method,status,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(10),sb.from('orders').select('id,total,status,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(10)]);let cart={};
app.innerHTML=`<div><header style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b style="font-size:21px">⚡ Libyan Store</b><div style="color:#8d98aa">${esc(p?.full_name||session.user.email)}</div></div><button id="out" style="padding:9px 13px;border:1px solid #344357;border-radius:10px;background:#111822;color:#fff">خروج</button></header><div style="margin:16px 0;padding:18px;border-radius:18px;background:#24150f;border:1px solid #5a3020"><span style="color:#ff9b69">رصيد المحفظة</span><strong style="display:block;font-size:30px;margin-top:4px">${Number(w?.balance||0).toFixed(2)} د.ل</strong></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button id="topupBtn" style="padding:11px 14px;border:0;border-radius:11px;background:#ff6428;color:#fff">+ شحن المحفظة</button><button id="ordersBtn" style="padding:11px 14px;border:1px solid #344357;border-radius:11px;background:#111822;color:#fff">طلباتي</button></div><h2>المنتجات</h2><div id="products" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">${(products||[]).map(x=>`<article style="padding:15px;border:1px solid #202b3a;border-radius:16px;background:#101821"><b>${esc(x.name)}</b><div style="color:#8d98aa;margin:7px 0;min-height:22px">${esc(x.description||'')}</div><strong style="color:#ff7a3d">${x.price} ${esc(x.currency)}</strong><button data-add="${x.id}" style="display:block;width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:#f1f4f8;color:#0c1118;font-weight:700">أضف للسلة</button></article>`).join('')}</div><div id="panel" style="margin-top:18px"></div></div>`;
out.onclick=async()=>{await sb.auth.signOut();start()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;renderCart(products,w)});topupBtn.onclick=()=>renderTopup(topups||[]);ordersBtn.onclick=()=>renderOrders(orders||[]);renderCart(products,w)}
function renderCart(products,w){const items=Object.entries(cart);if(!items.length){panel.innerHTML='<div style="padding:15px;border:1px dashed #344357;border-radius:14px;color:#8d98aa">السلة فارغة</div>';return}const rows=items.map(([id,q])=>{const p=products.find(x=>x.id===id);return p?`<div style="display:flex;justify-content:space-between;padding:8px 0"><span>${esc(p.name)} × ${q}</span><b>${(p.price*q).toFixed(2)} د.ل</b></div>`:''}).join('');const total=items.reduce((s,[id,q])=>s+(Number(products.find(x=>x.id===id)?.price||0)*q),0);panel.innerHTML=`<div style="padding:15px;border:1px solid #263345;border-radius:16px;background:#101821"><h3>السلة</h3>${rows}<hr style="border-color:#202b3a"><b>الإجمالي: ${total.toFixed(2)} د.ل</b><button id="buy" style="display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:11px;background:#ff6428;color:#fff;font-weight:700">شراء من المحفظة</button></div>`;buy.onclick=async()=>{const name=prompt('اسم العميل')||'';const phone=prompt('رقم الهاتف')||'';if(!name||!phone)return;const payload=items.map(([product_id,quantity])=>({product_id,quantity}));const {error}=await sb.rpc('create_wallet_order',{p_items:payload,p_customer_name:name,p_customer_phone:phone});if(error)return alert(error.message);cart={};alert('تم إنشاء الطلب وتسليم الأكواد في قسم طلباتي');location.reload()}}
function renderTopup(history){panel.innerHTML=`<div style="padding:15px;border:1px solid #263345;border-radius:16px;background:#101821"><h3>شحن المحفظة</h3><p style="color:#8d98aa">سيتم مراجعة التحويل يدويًا قبل إضافة الرصيد.</p><select id="tm" style="width:100%;padding:12px;margin:5px 0;border-radius:10px;background:#0a1017;color:#fff;border:1px solid #263345"><option value="libyana">ليبيانا</option><option value="almadar">المدار</option></select><input id="ta" type="number" min="1" placeholder="المبلغ بالدينار" style="width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:10px;background:#0a1017;color:#fff;border:1px solid #263345"><input id="tp" placeholder="رقم الهاتف المحوّل منه" style="width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:10px;background:#0a1017;color:#fff;border:1px solid #263345"><button id="sendTop" style="width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#ff6428;color:#fff">إرسال طلب الشحن</button><div style="margin-top:15px">${history.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #202b3a">${x.amount} د.ل — ${esc(x.method)} — ${esc(x.status)}</div>`).join('')||'<span style="color:#8d98aa">لا توجد طلبات شحن</span>'}</div></div>`;sendTop.onclick=async()=>{const amount=Number(ta.value);if(!(amount>0)||!tp.value.trim())return alert('أكمل البيانات');const {error}=await sb.rpc('create_wallet_topup',{p_amount:amount,p_method:tm.value,p_sender_phone:tp.value.trim()});if(error)return alert(error.message);alert('تم إرسال طلب الشحن للمراجعة');location.reload()}}
async function renderOrders(orders){let html='';for(const o of orders){const {data:codes}=await sb.rpc('get_my_order_codes',{p_order_id:o.id});html+=`<div style="padding:14px;border:1px solid #263345;border-radius:14px;margin-bottom:8px;background:#101821"><b>${Number(o.total).toFixed(2)} د.ل</b><span style="float:left;color:#8d98aa">${esc(o.status)}</span><div style="color:#8d98aa;margin-top:6px">${new Date(o.created_at).toLocaleString('ar-LY')}</div>${(codes||[]).map(c=>`<div style="margin-top:8px;padding:10px;background:#0a1017;border-radius:9px;font-family:monospace">${esc(c.code)}</div>`).join('')}</div>`}panel.innerHTML=`<h3>طلباتي</h3>${html||'<p style="color:#8d98aa">لا توجد طلبات بعد.</p>'}`}
}
</script></body></html>

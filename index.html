<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Libyan Store</title><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body style="margin:0;background:#070b12;color:#fff;font-family:system-ui,Tahoma,Arial"><main style="max-width:760px;margin:auto;padding:28px 18px"><section style="background:#0d131c;border:1px solid #263345;border-radius:24px;padding:24px;box-shadow:0 18px 50px #0006"><div style="font-size:34px">⚡</div><h1 style="margin:8px 0">Libyan Store</h1><p style="color:#9ba7b8">متجر الاشتراكات الرقمية</p><div id="app"></div></section></main><script>
const cfg=window.LIBYAN_STORE_CONFIG||{};
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!cfg.url||!cfg.publishableKey){app.innerHTML='<p style="color:#ff9b69">المتجر جاهز للربط. أضف إعدادات Supabase في supabase-config.js.</p>'}
else{const {createClient}=supabase;const sb=createClient(cfg.url,cfg.publishableKey);render();
async function render(){const {data:{session}}=await sb.auth.getSession(); if(session) return home(session); login();}
function login(){app.innerHTML=`<div style="display:grid;gap:12px"><input id="email" placeholder="البريد الإلكتروني" type="email" style="padding:14px;border-radius:12px;border:1px solid #263345;background:#0a1017;color:#fff"><input id="pass" placeholder="كلمة المرور" type="password" style="padding:14px;border-radius:12px;border:1px solid #263345;background:#0a1017;color:#fff"><button id="signin" style="padding:14px;border:0;border-radius:12px;background:#ff6428;color:#fff;font-weight:700">تسجيل الدخول</button><button id="signup" style="padding:14px;border:1px solid #344357;border-radius:12px;background:#111822;color:#fff">إنشاء حساب</button><p id="msg" style="color:#9ba7b8"></p></div>`;signin.onclick=()=>auth('signin');signup.onclick=()=>auth('signup')}
async function auth(type){msg.textContent='جارٍ التنفيذ...';const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password)return msg.textContent='أدخل البريد وكلمة المرور';const r=type==='signin'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error)return msg.textContent=r.error.message;msg.textContent=type==='signup'?'تم إنشاء الحساب. تحقق من البريد إن طُلب ذلك.':'تم الدخول';render()}
async function home(session){const [{data:p},{data:w},{data:products}]=await Promise.all([sb.from('profiles').select('full_name,phone,role').eq('id',session.user.id).single(),sb.from('wallets').select('balance').eq('user_id',session.user.id).single(),sb.from('products').select('id,name,description,price,currency').eq('active',true).order('created_at')]);app.innerHTML=`<div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${esc(p?.full_name||session.user.email)}</b><div style="color:#8d98aa">${esc(session.user.email)}</div></div><button id="out" style="padding:10px;border:1px solid #344357;border-radius:10px;background:#111822;color:#fff">خروج</button></div><div style="margin:18px 0;padding:18px;border-radius:18px;background:#24150f;border:1px solid #5a3020"><div style="color:#ff9b69">رصيد المحفظة</div><strong style="font-size:30px">${Number(w?.balance||0).toFixed(2)} د.ل</strong></div><h2>المنتجات</h2><div style="display:grid;gap:10px">${(products||[]).map(x=>`<div style="padding:15px;border:1px solid #202b3a;border-radius:16px;background:#101821"><b>${esc(x.name)}</b><div style="color:#8d98aa;margin:5px 0">${esc(x.description||'')}</div><strong style="color:#ff7a3d">${x.price} ${esc(x.currency)}</strong></div>`).join('')}</div></div>`;out.onclick=async()=>{await sb.auth.signOut();render()}}
}
</script></body></html>
